name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/cSON.h
            SonCompiler
            example
          generate_release_notes: true
