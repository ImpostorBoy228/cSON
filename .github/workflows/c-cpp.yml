name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: lua
      run: sudo apt-get install lua
    - name: make
      run: make
    - name: make tests
      run: make tests
