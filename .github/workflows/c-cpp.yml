name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make
    - name: gen eval
      run: ./cSON --gen-evalpoint SONEVAL.ass emmm.son
    - name: make tests
      run: make tests
